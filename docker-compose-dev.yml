name: whoisrgj-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whoisrgj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whoisrgj_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-whoisrgj_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whoisrgj} -d ${POSTGRES_DB:-whoisrgj_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ALG: ${AUTH_JWT_ALG:-HS256}
      AUTH_JWT_EXP_MINUTES: ${AUTH_JWT_EXP_MINUTES:-60}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-whoisrgjcom-media-dev}
    volumes:                                                                                                                              
      - ~/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
