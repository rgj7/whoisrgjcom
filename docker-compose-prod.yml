name: whoisrgj-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      frontend:
        condition: service_healthy
      gcsproxy:
        condition: service_started
        
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2m
      timeout: 3s
      retries: 3
      start_period: 30s

  backend:
    image: ghcr.io/rgj7/whoisrgjcom-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 2m
      timeout: 3s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/rgj7/whoisrgjcom-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 2m
      timeout: 3s
      retries: 3
      start_period: 20s

  gcsproxy:
    image: ghcr.io/daichirata/gcsproxy:0.7.0
    restart: unless-stopped
    command: [
      "-b", "0.0.0.0:8080",
      "-bucket", "${GCS_BUCKET_NAME:?GCS_BUCKET_NAME is required}", 
      "-cors-origin", "https://blog.whoisrgj.com"
      ]
    expose:
      - "8080"

volumes:
  postgres_data:
  caddy_data:
