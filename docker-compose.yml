services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whoisrgj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whoisrgj_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-whoisrgj_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whoisrgj} -d ${POSTGRES_DB:-whoisrgj_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
